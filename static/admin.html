<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Verlock Admin</title>
  <style>
    @font-face { font-family:'Phantom Sans'; src:url('https://assets.hackclub.com/fonts/Phantom_Sans_0.7/Bold.woff2') format('woff2'); font-weight:700; font-display:swap; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f4f4f4; color:#333; font-family:system-ui,sans-serif; }
    main { max-width:1080px; margin:48px auto; padding:0 24px; }
    header,.section-heading { display:flex; justify-content:space-between; align-items:center; gap:16px; }
    h1,h2,button { font-family:'Phantom Sans',system-ui,sans-serif; }
    h1 { margin:8px 0; font-size:32px; } h2 { margin:0; font-size:22px; }
    a { color:#ec3750; } header a { text-decoration:none; }
    p { line-height:1.5; } .muted { color:#666; } .subtitle { margin-top:0; }
    section { background:#fff; border:1px solid #e5e5e5; border-radius:8px; margin-top:24px; padding:24px; box-shadow:0 2px 5px #00000005; }
    .section-heading { margin-bottom:12px; } .count { font-family:system-ui,sans-serif; font-size:14px; color:#666; font-weight:400; margin-left:8px; }
    button { border:0; border-radius:4px; background:#ec3750; color:#fff; padding:10px 16px; cursor:pointer; font-size:15px; }
    button.secondary { background:#eee; color:#333; } button.danger { background:#fff0f2; color:#b52039; }
    button:disabled { opacity:.5; cursor:default; } button:focus-visible,a:focus-visible { outline:3px solid #338eda; outline-offset:3px; }
    input,select { padding:10px 12px; border:1px solid #ccc; border-radius:4px; font:inherit; width:100%; background:#fff; color:#333; }
    input:focus,select:focus { outline:2px solid #338eda; outline-offset:1px; }
    label { font-size:14px; display:block; margin-bottom:6px; }
    form { display:grid; grid-template-columns:minmax(160px,1fr) 160px auto; align-items:end; gap:12px; margin:24px 0 12px; }
    .message { font-size:14px; min-height:22px; margin:8px 0; } .message.error { color:#b52039; }
    .empty { padding:20px 0 4px; color:#666; }
    .sandbox { display:grid; grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)); gap:20px; padding:18px 0; border-top:1px solid #eee; }
    .sandbox strong,.person strong { display:block; overflow-wrap:anywhere; font-size:14px; }
    .sandbox small { display:block; color:#666; margin-top:6px; overflow-wrap:anywhere; }
    .sandbox dt { font-size:12px; color:#666; margin-bottom:5px; } .sandbox dd { margin:0; font-size:14px; } dl { margin:0; }
    .people { list-style:none; padding:0; margin:16px 0 0; }
    .person { display:flex; justify-content:space-between; align-items:center; gap:16px; border-top:1px solid #eee; padding:16px 0; }
    .person-details { min-width:0; } .person small { color:#666; display:block; margin-top:5px; overflow-wrap:anywhere; }
    .person-actions { display:flex; align-items:center; gap:10px; } .person-actions select { width:130px; }
    .identity { display:flex; align-items:center; gap:12px; min-width:0; } .identity-text { min-width:0; }
    .identity strong a { color:inherit; text-decoration:none; } .identity strong a:hover { text-decoration:underline; }
    .identity .real-name { color:#666; font-weight:400; } .identity small { display:block; color:#666; margin-top:5px; overflow-wrap:anywhere; }
    .avatar { width:44px; height:44px; flex:none; border-radius:8px; object-fit:cover; background:#eee; }
    .identity.compact { gap:8px; margin-top:8px; } .identity.compact .avatar { width:24px; height:24px; border-radius:6px; } .identity.compact small { margin-top:2px; }
    .slack-id { font-family:ui-monospace,monospace; } .unknown { color:#b52039 !important; }
    #slack-preview { min-height:24px; margin:0 0 4px; }
    .badge { display:inline-block; margin:0 0 6px; padding:3px 8px; background:#eee; border-radius:12px; font-size:12px; }
    [hidden] { display:none !important; }
    @media(max-width:640px) { main { margin:24px auto; padding:0 16px; } section { padding:18px; } header { align-items:flex-start; } form { grid-template-columns:1fr 120px; } form button { grid-column:1/-1; } .sandbox { grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; } .sandbox .workspace { grid-column:1/-1; } .person { align-items:flex-start; flex-direction:column; gap:12px; } .person-actions { width:100%; } .person-actions select { flex:1; } }
  </style>
</head>
<body>
<main>
  <header><div><h1>Admin dashboard</h1><p class="subtitle muted">Review workspaces and manage access.</p></div><a href="/">Back to Airlock</a></header>
  <p id="access-message" role="status">Checking admin access…</p>
  <a id="login-link" href="/login" hidden>Log in with Hack Club</a>
  <div id="dashboard" hidden>
    <section aria-labelledby="sandboxes-heading">
      <div class="section-heading"><h2 id="sandboxes-heading">Running sandboxes <span id="sandbox-count" class="count"></span></h2><button id="refresh-sandboxes" class="secondary" type="button">Refresh sandboxes</button></div>
      <p id="sandbox-message" class="message" role="status"></p>
      <div id="sandboxes" aria-live="polite"></div>
    </section>
    <section aria-labelledby="people-heading">
      <div class="section-heading"><h2 id="people-heading">People with access <span id="people-count" class="count"></span></h2><button id="refresh-people" class="secondary" type="button">Refresh people</button></div>
      <p class="muted">Members can start review sessions. Admins also manage access and view running sandboxes.</p>
      <form id="add-person">
        <div><label for="slack-id">Slack member ID</label><input id="slack-id" name="slack_id" placeholder="U123456789" pattern="[UW][A-Z0-9]{5,31}" required autocomplete="off"></div>
        <div><label for="new-role">Role</label><select id="new-role"><option value="member">Member</option><option value="admin">Admin</option></select></div>
        <button id="add-button" type="submit">Add person</button>
      </form>
      <div id="slack-preview" aria-live="polite"></div>
      <p id="people-message" class="message" role="status"></p>
      <ul id="people" class="people"></ul>
    </section>
  </div>
</main>
<script>
  const byId = id => document.getElementById(id);
  let currentUser, people = [], peopleBusy = false, sandboxBusy = false;
  function node(tag, text, className) { const el=document.createElement(tag); if(text !== undefined)el.textContent=text; if(className)el.className=className; return el; }
  const profiles=new Map();
  function lookup(id) {
    if(!profiles.has(id))profiles.set(id,fetch(`https://cachet.hackclub.com/users/${encodeURIComponent(id)}`)
      .then(r=>{ if(!r.ok)throw new Error(); return r.json(); })
      .then(p=>p.type==='user'?p:{missing:true})
      .catch(()=>{ profiles.delete(id); return null; }));
    return profiles.get(id);
  }
  function identity(id, {compact=false, before=[]}={}) {
    const wrap=node('div',undefined,compact?'identity compact':'identity'), avatar=node('img',undefined,'avatar'), text=node('div',undefined,'identity-text');
    const name=node('strong',id), meta=node('small'); meta.append(node('span',id,'slack-id'));
    avatar.alt=''; text.append(...before,name,meta); wrap.append(avatar,text);
    lookup(id).then(profile=>{
      if(!profile)return;
      if(profile.missing) { meta.append(' · Not found in Hack Club Slack'); meta.classList.add('unknown'); return; }
      const link=node('a',profile.displayName||profile.realName||id); link.href=`https://hackclub.slack.com/team/${encodeURIComponent(id)}`; link.target='_blank'; link.rel='noopener noreferrer';
      name.replaceChildren(link);
      if(profile.realName&&profile.realName!==profile.displayName)name.append(node('span',` (${profile.realName})`,'real-name'));
      if(profile.pronouns)meta.append(` · ${profile.pronouns}`);
      if(/^https:\/\//.test(profile.imageUrl||'')) avatar.src=profile.imageUrl;
    });
    return wrap;
  }
  function message(id, text, error=false) { const el=byId(id); el.textContent=text; el.classList.toggle('error',error); }
  function deny(text, login=false) { byId('dashboard').hidden=true; byId('access-message').hidden=false; byId('access-message').textContent=text; byId('login-link').hidden=!login; }
  async function api(path, options={}) {
    const response=await fetch(path,{cache:'no-store',...options,headers:{'Content-Type':'application/json',...options.headers}});
    const body=await response.json().catch(()=>({}));
    if(!response.ok) {
      if(response.status===401)deny('Log in with an admin account to manage Verlock.',true);
      if(response.status===403)deny('Admin access is required to manage Verlock.');
      const error=new Error(typeof body.detail==='string'?body.detail:response.status===422?'Enter a valid Slack member ID and role.':'The request failed. Please retry.'); error.status=response.status; throw error;
    }
    return body;
  }
  async function checkAccess() {
    try {
      const data=await api('/api/v1/me'); currentUser=data.user;
      if(!currentUser.is_admin) { deny('Admin access is required to manage Verlock.'); return false; }
      byId('access-message').hidden=true; byId('login-link').hidden=true; byId('dashboard').hidden=false; return true;
    } catch(error) { if(![401,403].includes(error.status))deny(error.message); return false; }
  }
  async function refreshSandboxes() {
    if(sandboxBusy)return; sandboxBusy=true; byId('refresh-sandboxes').disabled=true; message('sandbox-message','Loading running sandboxes…');
    try {
      const sandboxes=await api('/api/v1/admin/sandboxes'); byId('sandboxes').replaceChildren(); byId('sandbox-count').textContent=`(${sandboxes.length})`;
      if(!sandboxes.length)byId('sandboxes').append(node('p','No running sandboxes.','empty'));
      for(const sandbox of sandboxes) {
        const row=node('article',undefined,'sandbox'), workspace=node('div',undefined,'workspace'); workspace.append(node('strong',sandbox.name));
        if(sandbox.repo_url) { const link=node('a',sandbox.repo_url.replace('https://github.com/','')); link.href=sandbox.repo_url; link.target='_blank'; link.rel='noopener noreferrer'; workspace.append(link); }
        workspace.append(sandbox.owner?identity(sandbox.owner,{compact:true}):node('small','Owner: Not recorded')); row.append(workspace);
        for(const [label,value] of [['Started',sandbox.created],['Expires',sandbox.expires],['Resources',`${sandbox.vcpus} vCPU · ${sandbox.memory} · ${sandbox.region}`]]) { const list=node('dl'); list.append(node('dt',label),node('dd',value)); row.append(list); }
        byId('sandboxes').append(row);
      }
      message('sandbox-message','');
    } catch(error) { message('sandbox-message',error.message,true); }
    finally { sandboxBusy=false; byId('refresh-sandboxes').disabled=false; }
  }
  function lockPeople(locked) { peopleBusy=locked; for(const el of byId('add-person').elements)el.disabled=locked; byId('refresh-people').disabled=locked; renderPeople(); }
  function renderPeople() {
    byId('people').replaceChildren(); byId('people-count').textContent=`(${people.length})`;
    if(!people.length)byId('people').append(node('li','No people have access.','empty'));
    const admins=people.filter(p=>p.role==='admin').length;
    for(const person of [...people].sort((a,b)=>a.role.localeCompare(b.role)||a.slack_id.localeCompare(b.slack_id))) {
      const row=node('li',undefined,'person'), details=node('div',undefined,'person-details'), actions=node('div',undefined,'person-actions');
      const card=identity(person.slack_id,{before:[node('span',person.role==='admin'?'Admin':'Member','badge')]}), text=card.querySelector('.identity-text');
      if(person.email)text.append(node('small',person.email));
      if(person.slack_id===currentUser.slack_id)text.append(node('small','You'));
      details.append(card);
      const lastAdmin=person.role==='admin'&&admins===1;
      const select=node('select'); select.setAttribute('aria-label',`Role for ${person.slack_id}`);
      for(const role of ['member','admin']) { const option=node('option',role==='admin'?'Admin':'Member'); option.value=role; select.append(option); }
      select.value=person.role; select.disabled=peopleBusy||lastAdmin;
      select.addEventListener('change',()=>mutatePeople(`/api/v1/admin/users/${person.slack_id}`,{method:'PATCH',body:JSON.stringify({role:select.value})},'Role updated.'));
      const remove=node('button','Remove','danger'); remove.type='button'; remove.setAttribute('aria-label',`Remove ${person.slack_id}`); remove.disabled=peopleBusy||lastAdmin;
      remove.addEventListener('click',()=>{if(confirm(`Remove access for ${person.slack_id}?`))mutatePeople(`/api/v1/admin/users/${person.slack_id}`,{method:'DELETE'},'Access removed.');});
      actions.append(select,remove); if(lastAdmin)card.querySelector('.identity-text').append(node('small','At least one admin is required.')); row.append(details,actions); byId('people').append(row);
    }
  }
  async function refreshPeople() {
    if(peopleBusy)return; lockPeople(true); message('people-message','Loading people…');
    try { people=await api('/api/v1/admin/users'); message('people-message',''); }
    catch(error) { message('people-message',error.message,true); }
    finally { lockPeople(false); }
  }
  async function mutatePeople(path, options, success) {
    if(peopleBusy)return; lockPeople(true); message('people-message','Saving…');
    try {
      await api(path,options);
      if(!await checkAccess())return;
      people=await api('/api/v1/admin/users'); message('people-message',success);
      if(options.method==='POST')byId('add-person').reset();
    } catch(error) { message('people-message',error.message,true); }
    finally { lockPeople(false); }
  }
  byId('add-person').addEventListener('submit',event=>{event.preventDefault();mutatePeople('/api/v1/admin/users',{method:'POST',body:JSON.stringify({slack_id:byId('slack-id').value.trim(),role:byId('new-role').value})},'Access added.');});
  let previewTimer;
  byId('slack-id').addEventListener('input',()=>{
    clearTimeout(previewTimer); byId('slack-preview').replaceChildren();
    const id=byId('slack-id').value.trim();
    if(byId('slack-id').checkValidity()&&id)previewTimer=setTimeout(()=>byId('slack-preview').replaceChildren(identity(id,{compact:true})),300);
  });
  byId('add-person').addEventListener('reset',()=>{clearTimeout(previewTimer); byId('slack-preview').replaceChildren();});
  byId('refresh-sandboxes').addEventListener('click',refreshSandboxes); byId('refresh-people').addEventListener('click',refreshPeople);
  (async()=>{if(await checkAccess())await Promise.all([refreshSandboxes(),refreshPeople()]);})();
</script>
</body>
</html>
