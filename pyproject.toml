[project]
name = "verlock"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "markdown>=3.7,<4",
    "cachetools>=5.5,<7",
    "python-dotenv>=1,<2",
    "authlib>=1.4,<2",
    "itsdangerous>=2.2,<3",
    "slack-sdk>=3.34,<4",
    "vercel>=0.11.6,<1",
]
[tool.uv]
package = false
[tool.vercel]
entrypoint = "main:app"
[tool.vercel.scripts]
build = "python build.py"
