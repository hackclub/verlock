worker_processes 1;
pid /tmp/airlock-nginx.pid;
error_log /tmp/airlock-nginx-error.log;
events { worker_connections 1024; }
http {
    access_log off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $cookie_airlock_session $authorized {
        default 0;
        "__SESSION_TOKEN__" 1;
    }
    server {
        listen 8080;
        absolute_redirect off;
        location = /launch/__SESSION_TOKEN__ {
            add_header Set-Cookie "airlock_session=__SESSION_TOKEN__; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=3600";
            add_header Cache-Control "no-store";
            add_header Referrer-Policy "no-referrer";
            return 302 /;
        }
        location / {
            if ($authorized = 0) { return 403; }
            # KasmVNC uses its generated self-signed certificate on loopback.
            # Public TLS is terminated by the Vercel Sandbox port proxy.
            proxy_pass https://127.0.0.1:6901;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Authorization "Basic __BASIC_AUTH__";
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }
}
